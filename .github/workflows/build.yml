name: Build SmartSearchAI.exe

# Runs on every push to main (build+test only, no public link), AND on
# pushing a version tag like "v1.0" (build + also publish a public Release
# with a direct download link -- see the last two steps below). Can also
# be triggered manually from the Actions tab ("Run workflow" button); a
# manual run behaves like a push to main (Artifact only, no Release).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

# Needed for the "Publish GitHub Release" step below to be allowed to
# create a release -- the default GITHUB_TOKEN is read-only otherwise.
permissions:
  contents: write

jobs:
  build:
    # windows-latest = a clean, GitHub-managed Windows VM with full admin +
    # internet, unrelated to your company's machine/policies -- this is
    # exactly the "other machine" we needed and didn't have.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # pyinstaller + pyinstaller-hooks-contrib are already listed inside
        # requirements.txt itself now -- no separate "pip install
        # pyinstaller" line needed here anymore.

      - name: Build exe with PyInstaller
        run: |
          pyinstaller SmartSearchAI.spec

      - name: Upload build folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSearchAI-windows
          # onedir build -> dist/SmartSearchAI/ is a FOLDER containing
          # SmartSearchAI.exe plus all its DLLs/data. Upload the whole
          # thing; upload-artifact zips it automatically for download.
          path: dist/SmartSearchAI/
          compression-level: 6

      # Everything below only runs when this workflow was triggered by
      # pushing a version TAG (e.g. `git tag v1.0 && git push origin v1.0`)
      # -- NOT on a plain push to main, and NOT on a manual "Run workflow"
      # click. This is what gives friends a public, no-login-required
      # download link, unlike the Artifact above.
      - name: Zip build folder for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/SmartSearchAI/* -DestinationPath SmartSearchAI-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartSearchAI-windows.zip
